<script>
const CFG = {
  title:      'China AI Landscape',
  titleLocal: '中国人工智能版图',
  subtitle:   'Living reference · Updated automatically by China Brief agent each issue',
  accent:     '#c0392b',
  accentLight:'#fff0ee',
  accentMid:  '#f8d7d4',
  backLink:   'brief.html',
  backLabel:  'China Brief',
  dataFile:   'china-ai-landscape.json',
  cats: {
    foundation: { label: 'Foundation Model Labs · 大模型公司',   color: '#c0392b', bg: '#fff0ee' },
    robotics:   { label: 'Physical AI & Robotics · 具身智能',    color: '#27ae60', bg: '#f0faf4' },
    chips:      { label: 'Chips & AI Infrastructure · 芯片与算力', color: '#e67e22', bg: '#fff8f0' },
    cloud:      { label: 'Cloud Platforms · 云计算',             color: '#1a56db', bg: '#f0f4fe' },
    auto:       { label: 'Autonomous Driving · 自动驾驶',         color: '#8e44ad', bg: '#f8f0fe' },
    security:   { label: 'AI Security & Enterprise',             color: '#2c3e50', bg: '#f0f4f8' },
    gov:        { label: 'Government Bodies · 政府机构',          color: '#5a6a7a', bg: '#f4f4f6' }

};

<style>
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { background:#f4f1ec; font-family:'Inter',sans-serif; color:#1a1a1a; min-height:100vh; }

.header-back a { color:#e8d5b0; font-size:11px; font-weight:600; text-decoration:none; letter-spacing:1px; border:1px solid #3a3a6e; padding:5px 12px; border-radius:3px; display:inline-block; transition:background 0.2s; }
.header-back a:hover { background:#2a2a4e; }
.header-eyebrow { font-size:10px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
.header-title { font-family:'Playfair Display',serif; font-size:36px; font-weight:700; color:#fff; }
.header-title .local { font-size:20px; font-weight:400; color:#e8d5b0; letter-spacing:6px; display:block; margin-top:6px; }
.header-deck { font-size:13px; color:#8a9bb5; margin-top:12px; max-width:600px; line-height:1.7; }

.badge { border:1px solid #3a3a6e; border-radius:3px; padding:4px 12px; font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#8a9bb5; }
.badge.live { border-color:var(--accent); color:var(--accent-text,#e8a89a); }

.stats-bar { background:#13132a; padding:16px 56px; display:flex; gap:32px; flex-wrap:wrap; border-bottom:1px solid #2a2a4e; }
.stat { text-align:center; }
.stat-num { font-family:'Playfair Display',serif; font-size:28px; font-weight:700; color:#fff; line-height:1; }
.stat-label { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#4a5a7a; margin-top:3px; }

.controls { background:#fff; padding:14px 56px; border-bottom:1px solid #e8e0d8; display:flex; align-items:center; gap:14px; flex-wrap:wrap; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
.search-wrap { position:relative; flex:1; min-width:180px; }
.search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.4; pointer-events:none; }
.search-input { width:100%; padding:8px 12px 8px 32px; border:1px solid #e0d8d0; border-radius:4px; font-family:'Inter',sans-serif; font-size:13px; outline:none; background:#f8f6f2; }
.search-input:focus { border-color:var(--accent); background:#fff; }
.cat-filters { display:flex; gap:6px; flex-wrap:wrap; }
.cat-btn { padding:5px 13px; border:1px solid #e0d8d0; border-radius:20px; font-size:11px; font-weight:600; cursor:pointer; background:#f8f6f2; color:#5a5a6a; white-space:nowrap; }
.cat-btn:hover { border-color:#1a1a2e; color:#1a1a2e; }
.cat-btn.active { background:#1a1a2e; color:#fff; border-color:#1a1a2e; }
.results-count { font-size:11px; color:#9a8a7a; white-space:nowrap; margin-left:auto; }

.grid-wrap { padding:32px 56px 56px; }
.cat-section { margin-bottom:48px; }
.cat-section.hidden { display:none; }
.section-header { display:flex; align-items:center; gap:16px; margin-bottom:20px; }
.section-tag { font-size:9px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; padding:4px 10px; border-radius:2px; white-space:nowrap; }
.section-line { flex:1; height:1px; background:#e8e0d4; }
.section-count { font-size:10px; color:#9a8a7a; }

.company-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
.company-card { background:#fff; border-radius:6px; box-shadow:0 1px 8px rgba(0,0,0,.06); overflow:hidden; display:flex; flex-direction:column; transition:box-shadow .15s,transform .15s; }
.company-card:hover { box-shadow:0 4px 24px rgba(0,0,0,.12); transform:translateY(-2px); }
.company-card.hidden { display:none; }
.card-stripe { height:3px; }
.card-body { padding:16px 18px; flex:1; }
.card-name { font-size:15px; font-weight:700; color:#1a1a2e; }
.card-zh { font-size:13px; font-weight:600; margin-top:2px; letter-spacing:1px; }
.card-py { font-size:11px; color:#7a6a5a; font-style:italic; margin-top:1px; }
.card-ticker { font-size:10px; color:#9a8a9a; margin-top:2px; }
.card-desc { font-size:12px; color:#4a4a5a; line-height:1.6; margin-top:10px; }
.card-tags { margin-top:10px; display:flex; flex-wrap:wrap; gap:5px; }
.tag { font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:2px 8px; border-radius:2px; background:#f4f1ec; color:#6a6a7a; }
.tag.highlight { background:#fff0ee; color:#c0392b; }
.tag.green { background:#f0faf4; color:#27ae60; }
.tag.blue { background:#f0f4fe; color:#1a56db; }
.tag.red { background:#fef2f2; color:#991b1b; }
.card-footer { padding:8px 18px; border-top:1px solid #f4f1ec; display:flex; align-items:center; justify-content:space-between; }
.card-issue { font-size:10px; color:#9a8a7a; font-weight:600; }
.card-status { font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
.status-public { color:#1a56db; }
.status-private { color:#7a6a5a; }
.status-gov { color:#c0392b; }

.no-results { text-align:center; padding:80px 20px; color:#9a8a7a; display:none; }
.no-results.show { display:block; }
.no-results-local { font-size:32px; color:#e0d8d0; margin-bottom:12px; }

.footer { background:#1a1a2e; padding:20px 56px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
.footer-brand { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#e8d5b0; }
.footer-text { font-size:10px; color:#4a5a7a; }

.loading { text-align:center; padding:80px; color:#9a8a7a; font-size:14px; }

@media(max-width:680px) {
  .header, .stats-bar, .controls, .grid-wrap, .footer { padding-left:20px; padding-right:20px; }
  .company-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div id="_gate" style="position:fixed;inset:0;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-family:-apple-system,sans-serif;z-index:99999;"><div style="text-align:center;padding:48px 40px;"><div style="color:#c0392b;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;">朋友 · Private Access</div><div style="color:#e8d5b0;font-size:20px;font-weight:700;letter-spacing:2px;margin-bottom:28px;">Enter Password</div><input type="password" id="_pw" placeholder="password" style="background:#2a2a4e;border:1px solid #3a3a6e;border-radius:4px;color:#e8d5b0;font-size:15px;padding:11px 18px;width:240px;outline:none;text-align:center;letter-spacing:3px;display:block;margin:0 auto;" onkeydown="if(event.key==='Enter')_u()"><button onclick="_u()" style="display:block;margin:12px auto 0;background:#c0392b;border:none;border-radius:4px;color:#fff;cursor:pointer;font-size:11px;font-weight:700;letter-spacing:2px;padding:10px 28px;text-transform:uppercase;">Enter &#x2192;</button><div id="_e" style="color:#e74c3c;font-size:11px;letter-spacing:1px;margin-top:12px;min-height:16px;"></div></div></div>

<div class="header">
  <div class="header-back" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;"><a id="backLink" href="brief.html">← Return to China Brief</a><a href="china-snapshot.html" style="color:#e8d5b0;font-size:11px;font-weight:600;text-decoration:none;letter-spacing:1px;border:1px solid #3a3a6e;padding:5px 12px;border-radius:3px;display:inline-block;transition:background 0.2s;" onmouseover="this.style.background='#2a2a4e'" onmouseout="this.style.background=''">Snapshot →</a></div>
  <div class="header-eyebrow" id="eyebrow">朋友 Pengyou · China Brief · Zhōngguó Jiǎnbào</div>
  <div class="header-title" id="hTitle"></div>
  <div class="header-deck" id="hDeck"></div>
  <div class="header-meta">
    <span class="badge live" id="badgeIssue"></span>
    <span class="badge" id="badgeDate"></span>
    <span class="badge live">Living Document</span>
  </div>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat"><div class="stat-num" id="statTotal">—</div><div class="stat-label">Total Entities</div></div>
</div>

<div class="controls">
  <div class="search-wrap">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input class="search-input" id="searchInput" placeholder="Search companies, terms, sectors…" oninput="filterCards()">
  </div>
  <div class="cat-filters" id="catFilters"></div>
  <span class="results-count" id="resultsCount"></span>
</div>

<div class="grid-wrap" id="gridWrap">
  <div class="loading">Loading landscape data…</div>
</div>

<div class="no-results" id="noResults">
  <div class="no-results-local" id="noResultsLocal">无结果</div>
  <div>No matches found. Try a different search term.</div>
</div>

<div class="footer">
  <div class="footer-brand" id="footerBrand"></div>
  <div class="footer-text" id="footerText"></div>
</div>

<script>
// ── inject CSS variable ────────────────────────────────────────────────────────
document.documentElement.style.setProperty('--accent', CFG.accent);
document.getElementById('hTitle').innerHTML = CFG.title + `<span class="local">${CFG.titleLocal}</span>`;
document.getElementById('hDeck').textContent = CFG.subtitle;
document.getElementById('backLink').href = CFG.backLink;
document.getElementById('backLink').textContent = '← ' + CFG.backLabel;
document.getElementById('noResultsLocal').textContent = CFG.titleLocal.includes('中国') ? '无结果' : '結果なし';

let allEntities = [];
let currentCat = 'all';

// ── fetch data ────────────────────────────────────────────────────────────────
fetch(CFG.dataFile + '?v=' + Date.now())
  .then(r => r.json())
  .then(data => {
    allEntities = data.entities;
    const meta = data.meta;

    // header badges
    document.getElementById('badgeIssue').textContent = 'Issue #' + meta.issue;
    document.getElementById('badgeDate').textContent = meta.updated;

    // footer
    document.getElementById('footerBrand').textContent = CFG.titleLocal + ' · ' + CFG.title;
    document.getElementById('footerText').textContent =
      'Living document · Updated by agent · Issue #' + meta.issue + ' · ' + meta.updated + ' · Not investment advice';

    buildStats(allEntities);
    buildFilters(allEntities);
    buildGrid(allEntities);
  })
  .catch(err => {
    document.getElementById('gridWrap').innerHTML =
      '<div class="loading">⚠️ Could not load landscape data: ' + err.message + '</div>';
  });

// ── stats bar ─────────────────────────────────────────────────────────────────
function buildStats(entities) {
  const bar = document.getElementById('statsBar');
  const counts = {};
  entities.forEach(e => { counts[e.cat] = (counts[e.cat] || 0) + 1; });

  let html = `<div class="stat"><div class="stat-num">${entities.length}</div><div class="stat-label">Total Entities</div></div>`;
  Object.entries(CFG.cats).forEach(([k, v]) => {
    if (counts[k]) {
      html += `<div class="stat"><div class="stat-num">${counts[k]}</div><div class="stat-label">${v.label.split(' · ')[0]}</div></div>`;
    }
  });
  bar.innerHTML = html;
}

// ── category filter buttons ───────────────────────────────────────────────────
function buildFilters(entities) {
  const presentCats = new Set(entities.map(e => e.cat));
  const div = document.getElementById('catFilters');
  let html = `<button class="cat-btn active" onclick="setCat('all',this)">All</button>`;
  Object.entries(CFG.cats).forEach(([k, v]) => {
    if (presentCats.has(k)) {
      html += `<button class="cat-btn" onclick="setCat('${k}',this)">${v.label.split(' · ')[0]}</button>`;
    }
  });
  div.innerHTML = html;
}

// ── build grid ────────────────────────────────────────────────────────────────
function buildGrid(entities) {
  const wrap = document.getElementById('gridWrap');
  wrap.innerHTML = '';

  const byCat = {};
  entities.forEach(e => {
    if (!byCat[e.cat]) byCat[e.cat] = [];
    byCat[e.cat].push(e);
  });

  Object.entries(CFG.cats).forEach(([catKey, catMeta]) => {
    const group = byCat[catKey];
    if (!group) return;
    group.sort((a, b) => a.name.localeCompare(b.name));

    const section = document.createElement('div');
    section.className = 'cat-section';
    section.dataset.cat = catKey;

    section.innerHTML = `
      <div class="section-header">
        <span class="section-tag" style="background:${catMeta.bg};color:${catMeta.color}">${catMeta.label}</span>
        <div class="section-line"></div>
        <span class="section-count">${group.length} ${group.length === 1 ? 'entity' : 'entities'}</span>
      </div>
      <div class="company-grid"></div>
    `;

    const grid = section.querySelector('.company-grid');
    group.forEach(e => {
      const card = document.createElement('div');
      card.className = 'company-card';
      card.dataset.search = [e.name, e.zh, e.py, e.desc, (e.tags||[]).map(t=>t.l).join(' ')].join(' ').toLowerCase();

      const statusClass = e.status === 'public' ? 'status-public' : e.status === 'gov' ? 'status-gov' : 'status-private';
      const statusLabel = e.status === 'public' ? (e.ticker || 'Public') : e.status === 'gov' ? 'Government' : 'Private';

      const tagsHtml = (e.tags||[]).map(t =>
        `<span class="tag ${t.t||''}">${t.l}</span>`
      ).join('');

      card.innerHTML = `
        <div class="card-stripe" style="background:${catMeta.color}"></div>
        <div class="card-body">
          <div class="card-name">${e.name}</div>
          ${e.zh ? `<div class="card-zh" style="color:${catMeta.color}">${e.zh}</div>` : ''}
          ${e.py ? `<div class="card-py">${e.py}</div>` : ''}
          ${e.ticker ? `<div class="card-ticker">${e.ticker}</div>` : ''}
          <div class="card-desc">${e.desc}</div>
          ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
        </div>
        <div class="card-footer">
          <span class="card-issue">First seen ${e.issue}</span>
          <span class="card-status ${statusClass}">${statusLabel}</span>
        </div>
      `;
      grid.appendChild(card);
    });

    wrap.appendChild(section);
  });

  filterCards();
}

// ── filter ────────────────────────────────────────────────────────────────────
function setCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterCards();
}

function filterCards() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let visible = 0;

  document.querySelectorAll('.cat-section').forEach(section => {
    const catMatch = currentCat === 'all' || currentCat === section.dataset.cat;
    let sectionVisible = 0;
    section.querySelectorAll('.company-card').forEach(card => {
      const show = catMatch && (q === '' || card.dataset.search.includes(q));
      card.classList.toggle('hidden', !show);
      if (show) { sectionVisible++; visible++; }
    });
    section.classList.toggle('hidden', sectionVisible === 0);
  });

  document.getElementById('resultsCount').textContent = visible + ' ' + (visible === 1 ? 'entity' : 'entities');
  document.getElementById('noResults').classList.toggle('show', visible === 0);
}
</script>
