<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pengyou · Private</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#1a1a2e;font-family:-apple-system,'Inter',sans-serif;}
.gate{text-align:center;padding:48px 40px;}
.eye{color:#c0392b;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;}
.ttl{color:#e8d5b0;font-size:20px;font-weight:700;letter-spacing:2px;margin-bottom:28px;}
input{background:#2a2a4e;border:1px solid #3a3a6e;border-radius:4px;color:#e8d5b0;font-size:15px;padding:11px 18px;width:240px;outline:none;text-align:center;letter-spacing:3px;}
input:focus{border-color:#c0392b;}
input::placeholder{color:#4a5a7a;letter-spacing:1px;font-size:12px;}
button{display:block;margin:12px auto 0;background:#c0392b;border:none;border-radius:4px;color:#fff;cursor:pointer;font-size:11px;font-weight:700;letter-spacing:2px;padding:10px 28px;text-transform:uppercase;transition:background .15s;}
button:hover{background:#a93226;}
.err{color:#e74c3c;font-size:11px;letter-spacing:1px;margin-top:12px;min-height:16px;}
</style>
</head>
<body>
<div class="gate">
  <div class="eye">朋友 Pengyou · Private</div>
  <div class="ttl">Enter Password</div>
  <input type="password" id="pw" placeholder="password" onkeydown="if(event.key==='Enter')unlock()">
  <button onclick="unlock()">Enter →</button>
  <div class="err" id="err"></div>
</div>

async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function reveal(){const h=new TextDecoder().decode(Uint8Array.from(atob(C),c=>c.charCodeAt(0)));document.open();document.write(h);document.close();}
async function unlock(){const h=await sha256(document.getElementById('pw').value);if(h===H){localStorage.setItem(K,H);reveal();}else{document.getElementById('err').textContent='Incorrect password';}}
