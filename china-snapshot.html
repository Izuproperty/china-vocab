<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>China AI Snapshot · 中国AI速览</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #f4f1ec;
  --navy: #1a1a2e;
  --cream: #e8d5b0;
  --border: #e0d8d0;
  --text-dim: #9a8a7a;
}
body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--navy); min-height: 100vh; }

/* ── Header ── */
.header { background: var(--navy); padding: 32px 56px 28px; border-bottom: 4px solid #c0392b; }
.header-back { margin-bottom: 16px; }
.header-back a { color: var(--cream); font-size: 11px; font-weight: 600; text-decoration: none; letter-spacing: 1px; border: 1px solid #3a3a6e; padding: 5px 12px; border-radius: 3px; display: inline-block; transition: background .2s; }
.header-back a:hover { background: #2a2a4e; }
.header-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #c0392b; margin-bottom: 10px; }
.header-title { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; color: #fff; }
.header-title .local { font-size: 18px; font-weight: 400; color: var(--cream); letter-spacing: 5px; display: block; margin-top: 5px; }
.header-deck { font-size: 13px; color: #8a9bb5; margin-top: 10px; max-width: 560px; line-height: 1.7; }
.header-meta { margin-top: 18px; display: flex; gap: 14px; flex-wrap: wrap; }
.badge { border: 1px solid #3a3a6e; border-radius: 3px; padding: 4px 12px; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #8a9bb5; }

/* ── Content ── */
.content { padding: 40px 56px 64px; }

/* ── Category section ── */
.cat-section { margin-bottom: 48px; }
.cat-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.cat-label { font-size: 9px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; padding: 4px 12px; border-radius: 2px; white-space: nowrap; color: #fff; }
.cat-line { flex: 1; height: 1px; background: var(--border); }
.cat-count { font-size: 10px; color: var(--text-dim); white-space: nowrap; }

/* ── Logo grid ── */
.logo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }

/* ── Logo card ── */
.logo-card {
  background: #fff;
  border-radius: 8px;
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: 0 1px 6px rgba(0,0,0,.05);
  cursor: pointer;
  transition: box-shadow .15s, transform .15s;
  display: flex;
  flex-direction: column;
  user-select: none;
}
.logo-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.12); transform: translateY(-2px); }

/* ── Logo face ── */
.logo-face { height: 90px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.logo-img { width: 56px; height: 56px; object-fit: contain; display: block; }
.logo-monogram { width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 0; }
.mono-zh { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700; color: #fff; line-height: 1.1; letter-spacing: 1px; }
.mono-en { font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.7); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

/* ── Card info ── */
.logo-info { padding: 10px 10px 11px; border-top: 1px solid var(--border); flex: 1; }
.logo-name-en { font-size: 11px; font-weight: 700; color: var(--navy); line-height: 1.3; margin-bottom: 2px; }
.logo-name-zh { font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px; }

/* ── Modal overlay ── */
#modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#modal-overlay.open { display: flex; }

#modal-box {
  background: #fff;
  border-radius: 10px;
  max-width: 560px;
  width: 100%;
  max-height: 82vh;
  overflow-y: auto;
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.modal-close {
  position: absolute; top: 14px; right: 14px;
  background: none; border: none; cursor: pointer;
  font-size: 18px; color: #9a8a7a; line-height: 1;
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  transition: background .15s;
}
.modal-close:hover { background: #f0ece6; }

.modal-header {
  padding: 28px 28px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 18px;
  align-items: flex-start;
}
.modal-logo {
  width: 64px; height: 64px; flex-shrink: 0;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  border: 1px solid var(--border);
  background: #f8f6f2;
}
.modal-logo img { width: 48px; height: 48px; object-fit: contain; }
.modal-logo .modal-mono { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 9px; }
.modal-mono-text { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 1px; }
.modal-names { flex: 1; min-width: 0; }
.modal-name-en { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: var(--navy); line-height: 1.2; margin-bottom: 4px; }
.modal-name-zh { font-size: 15px; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 2px; }
.modal-pinyin { font-size: 11px; color: #b0a090; letter-spacing: 0.5px; font-style: italic; }
.modal-badges { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.modal-cat-badge { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 3px 9px; border-radius: 2px; color: #fff; }
.modal-status-badge { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 3px 9px; border-radius: 2px; border: 1px solid var(--border); color: var(--text-dim); }

.modal-body { padding: 20px 28px 28px; }
.modal-desc { font-size: 13px; line-height: 1.8; color: #3a3a4a; margin-bottom: 16px; }
.modal-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.tag { font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 2px; letter-spacing: 0.5px; }
.tag-highlight { background: #fff8e1; color: #b7791f; border: 1px solid #f6d860; }
.tag-green { background: #f0faf4; color: #276749; border: 1px solid #b2e0c4; }
.tag-default { background: #f4f1ec; color: #5a5a6a; border: 1px solid var(--border); }
.modal-issue { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); border-top: 1px solid var(--border); padding-top: 12px; }
.modal-full-link { display: inline-block; margin-top: 12px; font-size: 11px; font-weight: 600; color: #c0392b; text-decoration: none; letter-spacing: 0.5px; }
.modal-full-link:hover { text-decoration: underline; }

/* ── Footer ── */
.footer { background: var(--navy); padding: 18px 56px; display: flex; align-items: center; justify-content: space-between; }
.footer-brand { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--cream); }
.footer-text { font-size: 10px; color: #4a5a7a; }
.footer-text a { color: #4a5a7a; }

/* ── Responsive ── */
@media(max-width:680px) {
  .header, .content, .footer { padding-left: 20px; padding-right: 20px; }
  .logo-grid { grid-template-columns: repeat(auto-fill, minmax(100px,1fr)); gap: 10px; }
  .logo-face { height: 72px; }
  .modal-header { flex-direction: column; }
}

.loading { text-align: center; padding: 80px 20px; color: var(--text-dim); font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-back">
    <a href="china-ai-landscape-viz.html">← Full Landscape</a>
  </div>
  <div class="header-eyebrow">朋友 Pengyou · China Brief</div>
  <div class="header-title">
    China AI Snapshot
    <span class="local">中国AI速览</span>
  </div>
  <div class="header-deck">Corporate entities only · click any card for full profile</div>
  <div class="header-meta">
    <span class="badge" id="badge-issue">—</span>
    <span class="badge" id="badge-date">—</span>
    <span class="badge" id="badge-count">—</span>
  </div>
</div>

<div class="content" id="content">
  <div class="loading">Loading snapshot…</div>
</div>

<div class="footer">
  <div class="footer-brand">China AI Snapshot · 中国AI速览</div>
  <div class="footer-text">Updated automatically · <a href="china-ai-landscape-viz.html">Full Landscape →</a></div>
</div>

<!-- Modal -->
<div id="modal-overlay" onclick="closeModal()">
  <div id="modal-box" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-header" id="modal-header"></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const CATS = {
  foundation: { label: 'Foundation Model Labs',        color: '#c0392b', bg: '#fff0ee' },
  robotics:   { label: 'Physical AI & Robotics',       color: '#27ae60', bg: '#f0faf4' },
  chips:      { label: 'Chips & AI Infrastructure',    color: '#e67e22', bg: '#fff8f0' },
  cloud:      { label: 'Cloud Platforms',              color: '#1a56db', bg: '#f0f4fe' },
  auto:       { label: 'Autonomous Driving',           color: '#8e44ad', bg: '#f8f0fe' },
  security:   { label: 'AI Security & Enterprise',     color: '#2c3e50', bg: '#f0f4f8' },
};

// Domain map — Clearbit primary, Google social favicon fallback, then monogram
const DOMAINS = {
  'DeepSeek':                       'deepseek.com',
  'Baidu':                          'baidu.com',
  'ByteDance':                      'bytedance.com',
  'Alibaba':                        'alibaba.com',
  'Tencent':                        'tencent.com',
  'Zhipu AI':                       'zhipuai.cn',
  'Moonshot AI':                    'moonshot.cn',
  'Minimax':                        'minimaxi.com',
  '01.AI':                          '01.ai',
  'StepFun':                        'stepfun.com',
  'Manus':                          'manus.im',
  'Huawei (AI Chips)':              'huawei.com',
  'Huawei Cloud':                   'huawei.com',
  'Huawei Smart Car':               'huawei.com',
  'Huawei Ascend 950':              'huawei.com',
  'Alibaba Cloud':                  'alibabacloud.com',
  'Tencent Cloud':                  'cloud.tencent.com',
  'Baidu AI Cloud':                 'baidu.com',
  'Cambricon':                      'cambricon.com',
  'Moore Threads':                  'mthreads.com',
  'Biren Technology':               'birentech.com',
  'YMTC':                           'ymtc.com',
  'CXMT':                           'cxmt.com',
  'Tuya Smart':                     'tuya.com',
  'Unitree Robotics':               'unitree.com',
  'UBTECH':                         'ubtrobot.com',
  'Fourier Intelligence':           'fftai.com',
  'AgiBot':                         'agibot.com',
  'D-Robotics (Horizon Robotics)':  'horizon.auto',
  'Baidu Apollo':                   'apollo.auto',
  'Xpeng':                          'xiaopeng.com',
  'Xpeng Turing AI Chip':           'xiaopeng.com',
  'Pony.ai':                        'pony.ai',
  'WeRide':                         'weride.ai',
  'Momenta':                        'momenta.ai',
  'BYD Robotics':                   'byd.com',
};

// Store all entities for modal lookup
let entityMap = {};

function logoInitials(name, zh) {
  if (zh && /[一-龥]/.test(zh) && zh.length >= 2) return zh.substring(0, 2);
  return name.split(/[\s\-\.]+/).map(w => w[0] || '').join('').substring(0, 3).toUpperCase();
}

function makeLogoHtml(entity, size = 56) {
  const cat = CATS[entity.cat] || CATS.security;
  const domain = DOMAINS[entity.name];
  const mono = logoInitials(entity.name, entity.zh);
  const monoHtml = `<div class="logo-monogram" style="background:${cat.color};width:${size}px;height:${size}px;border-radius:${Math.round(size*0.2)}px;display:flex;align-items:center;justify-content:center;"><span class="mono-zh" style="font-size:${Math.round(size*0.33)}px">${mono}</span></div>`;

  if (!domain) return monoHtml;

  return `<img class="logo-img" style="width:${size}px;height:${size}px;"
    src="https://logo.clearbit.com/${domain}?size=128"
    onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
    alt="${entity.name}">
  ${monoHtml.replace('display:flex', 'display:none')}`;
}

function makeCard(entity) {
  const cat = CATS[entity.cat] || CATS.security;
  return `
    <div class="logo-card" onclick="openModal('${entity.name.replace(/'/g,"\\'")}')">
      <div class="logo-face" style="background:${cat.bg}">
        ${makeLogoHtml(entity, 56)}
      </div>
      <div class="logo-info">
        <div class="logo-name-en">${entity.name}</div>
        ${entity.zh ? `<div class="logo-name-zh">${entity.zh}</div>` : ''}
      </div>
    </div>`;
}

function openModal(name) {
  const e = entityMap[name];
  if (!e) return;
  const cat = CATS[e.cat] || CATS.security;
  const mono = logoInitials(e.name, e.zh);
  const domain = DOMAINS[e.name];

  // Build logo for modal (64px box)
  let logoInner;
  if (domain) {
    logoInner = `<img style="width:48px;height:48px;object-fit:contain;"
      src="https://logo.clearbit.com/${domain}?size=128"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
      alt="${e.name}">
    <div class="modal-mono" style="background:${cat.color};display:none"><span class="modal-mono-text">${mono}</span></div>`;
  } else {
    logoInner = `<div class="modal-mono" style="background:${cat.color}"><span class="modal-mono-text">${mono}</span></div>`;
  }

  const statusLabel = e.status === 'public' ? (e.ticker || 'Public') : e.status === 'gov' ? 'Government' : 'Private';

  document.getElementById('modal-header').innerHTML = `
    <div class="modal-logo">${logoInner}</div>
    <div class="modal-names">
      <div class="modal-name-en">${e.name}</div>
      ${e.zh ? `<div class="modal-name-zh">${e.zh}</div>` : ''}
      ${e.py ? `<div class="modal-pinyin">${e.py}</div>` : ''}
      <div class="modal-badges">
        <span class="modal-cat-badge" style="background:${cat.color}">${cat.label}</span>
        <span class="modal-status-badge">${statusLabel}</span>
      </div>
    </div>`;

  const tagsHtml = (e.tags || []).map(t => {
    const cls = t.t === 'highlight' ? 'tag-highlight' : t.t === 'green' ? 'tag-green' : 'tag-default';
    return `<span class="tag ${cls}">${t.l}</span>`;
  }).join('');

  document.getElementById('modal-body').innerHTML = `
    ${e.desc ? `<div class="modal-desc">${e.desc.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}</div>` : ''}
    ${tagsHtml ? `<div class="modal-tags">${tagsHtml}</div>` : ''}
    ${e.issue ? `<div class="modal-issue">Covered in ${e.issue}</div>` : ''}
    <a class="modal-full-link" href="china-ai-landscape-viz.html">View Full Landscape →</a>`;

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

fetch('china-ai-landscape.json?v=' + Date.now())
  .then(r => r.json())
  .then(data => {
    const meta = data.meta || {};
    const all = (data.entities || []).filter(e => e.cat !== 'gov');

    // Build lookup map
    all.forEach(e => entityMap[e.name] = e);

    document.getElementById('badge-issue').textContent = 'Issue #' + (meta.issue || '—');
    document.getElementById('badge-date').textContent = meta.updated || '—';
    document.getElementById('badge-count').textContent = all.length + ' companies';

    // Group by category, sort alphabetically within each
    const grouped = {};
    all.forEach(e => {
      if (!grouped[e.cat]) grouped[e.cat] = [];
      grouped[e.cat].push(e);
    });
    Object.values(grouped).forEach(arr => arr.sort((a,b) => a.name.localeCompare(b.name)));

    let html = '';
    for (const [cat, catMeta] of Object.entries(CATS)) {
      const entities = grouped[cat];
      if (!entities || !entities.length) continue;
      html += `
        <div class="cat-section">
          <div class="cat-header">
            <span class="cat-label" style="background:${catMeta.color}">${catMeta.label}</span>
            <div class="cat-line"></div>
            <span class="cat-count">${entities.length}</span>
          </div>
          <div class="logo-grid">
            ${entities.map(makeCard).join('')}
          </div>
        </div>`;
    }

    document.getElementById('content').innerHTML = html;
  })
  .catch(() => {
    document.getElementById('content').innerHTML =
      '<div class="loading">Could not load landscape data.</div>';
  });
</script>
</body>
</html>
