<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="China Brief">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<title>China Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f1ec;
  --surface: #1a1a2e;
  --card: #ffffff;
  --card2: #f8f6f2;
  --border: #e0d8d0;
  --border-dark: #2e2e52;
  --red: #c0392b;
  --cream: #e8d5b0;
  --blue: #4a7fa5;
  --navy: #1a1a2e;
  --text: #1a1a2e;
  --text-mid: #5a5a6a;
  --text-dim: #9a8a7a;
  --r: 6px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif;
}

/* ── Top bar ── */
#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px 12px;
  padding-top: max(14px, env(safe-area-inset-top));
  background: var(--navy);
  border-bottom: 4px solid var(--red);
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-left { display:flex; align-items:center; gap:12px; }
.back-btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 4px;
  color: #8a9bb5;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 5px 10px;
  cursor: pointer;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: color .15s;
}
.back-btn:hover { color: var(--cream); }
.topbar-title { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; color: #fff; }
.topbar-en { font-size: 11px; font-weight: 400; color: #8a9bb5; letter-spacing: .5px; margin-left: 6px; }
.topbar-pinyin { font-size: 10px; color: #4a5a7a; font-style: italic; letter-spacing: .5px; margin-top: 2px; }
.topbar-issue { font-size: 10px; font-weight: 600; letter-spacing: 1px; color: #4a5a7a; text-align: right; line-height: 1.6; text-transform: uppercase; }

/* ── Issue nav bar ── */
#issue-nav {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: #f0ede8;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 57px;
  z-index: 90;
}
.nav-btn {
  background: transparent;
  border: 1px solid #d0c8c0;
  border-radius: 4px;
  color: var(--text-mid);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  padding: 5px 11px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
  line-height: 1;
}
.nav-btn:hover:not(:disabled) { color: var(--navy); border-color: var(--navy); }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.nav-btn.latest {
  background: var(--navy);
  color: var(--cream);
  border-color: var(--navy);
}
.nav-btn.latest.at-latest {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}
.nav-spacer { flex: 1; }
.nav-archive-btn {
  background: transparent;
  border: 1px solid #d0c8c0;
  border-radius: 4px;
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 600;
  padding: 5px 11px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
  line-height: 1;
}
.nav-archive-btn:hover { color: var(--navy); border-color: var(--navy); }

/* ── Archive modal ── */
#archive-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 500;
  background: rgba(10,10,20,0.6);
  align-items: flex-end;
  justify-content: center;
}
#archive-modal.open { display: flex; }
.archive-sheet {
  background: var(--card);
  width: 100%;
  max-width: 520px;
  max-height: 72vh;
  border-radius: 12px 12px 0 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 -4px 32px rgba(0,0,0,0.2);
}
.archive-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.archive-title { font-weight: 700; font-size: 13px; color: var(--navy); letter-spacing: 0.5px; text-transform: uppercase; }
.archive-close {
  background: none; border: none; font-size: 16px; cursor: pointer;
  color: var(--text-dim); padding: 2px 6px; border-radius: 3px; line-height: 1;
}
.archive-close:hover { color: var(--navy); }
.archive-body { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
.archive-month {
  font-size: 9px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--text-dim); padding: 14px 20px 6px; background: var(--card2);
  border-bottom: 1px solid var(--border);
}
.archive-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 20px; cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
.archive-row:hover { background: var(--card2); }
.archive-row.current { background: #fff8f6; }
.archive-num { font-size: 10px; font-weight: 700; color: var(--text-dim); min-width: 28px; }
.archive-date { font-size: 12px; font-weight: 600; color: var(--text-mid); min-width: 52px; flex-shrink: 0; }
.archive-hed { font-size: 12px; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.archive-tag { font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--red); flex-shrink: 0; }

/* ── Main content ── */
#content {
  max-width: 860px;
  margin: 0 auto;
  padding: 24px 24px 90px;
}

/* ── Brief header ── */
.brief-header {
  background: var(--navy);
  border-radius: var(--r);
  padding: 28px 28px 24px;
  margin-bottom: 20px;
}
.brief-issue-badge {
  display: inline-block;
  background: transparent;
  color: var(--red);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 0;
  margin-bottom: 10px;
}
.brief-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  line-height: 1.25;
  margin-bottom: 10px;
}
.brief-meta {
  font-size: 10px;
  font-weight: 600;
  color: #4a5a7a;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.brief-summary {
  font-size: 14px;
  color: #8a9bb5;
  line-height: 1.75;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid #2e2e52;
}

/* ── Sections ── */
.section-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 12px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  cursor: pointer;
  user-select: none;
}
.section-num {
  font-size: 10px;
  font-weight: 700;
  font-style: italic;
  color: var(--red);
  background: transparent;
  border: none;
  padding: 0;
  flex-shrink: 0;
  min-width: 16px;
}
.section-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--navy);
  flex: 1;
  line-height: 1.3;
}
.section-tag {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 0;
  background: transparent;
  border-radius: 0;
  flex-shrink: 0;
}
.tag-ai { color: #1a56db; }
.tag-macro { color: #b45309; }
.tag-geo { color: #166534; }
.tag-market { color: #7e22ce; }
.tag-policy { color: #92400e; }
.section-chevron {
  font-size: 11px;
  color: var(--text-dim);
  transition: transform .2s;
  flex-shrink: 0;
}
.section-card.open .section-chevron { transform: rotate(180deg); }
.section-body {
  display: none;
  padding: 0 20px 20px;
  border-top: 1px solid var(--border);
}
.section-card.open .section-body { display: block; }
.section-text {
  font-size: 14px;
  line-height: 1.8;
  color: #2c2c3a;
  padding-top: 16px;
}
.section-text p { margin-bottom: 12px; }
.section-text p:last-child { margin-bottom: 0; }
.section-text strong { color: var(--navy); font-weight: 600; }

/* ── Vocab chips ── */
.vocab-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}
.vocab-chips-label {
  width: 100%;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.vocab-chip {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 10px;
  font-size: 13px;
  display: flex;
  align-items: baseline;
  gap: 6px;
  cursor: default;
}
.chip-zh { color: var(--red); font-size: 16px; font-weight: 600; }
.chip-en { color: var(--text-mid); font-size: 11px; }

/* ── Source / takeaway ── */
.section-source {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.takeaway-box {
  background: var(--card2);
  border-left: 3px solid var(--blue);
  border-radius: 0 4px 4px 0;
  padding: 12px 16px;
  margin-top: 14px;
  font-size: 13px;
  color: var(--text-mid);
  line-height: 1.7;
}
.takeaway-box strong { color: var(--navy); font-weight: 600; }

/* ── Podcast player ── */
.podcast-wrap {
  display: none;
  background: #0f0f1e;
  border: 1px solid #2e2e52;
  border-left: 4px solid var(--red);
  border-radius: var(--r);
  padding: 14px 18px 12px;
  margin-bottom: 12px;
}
.podcast-eyebrow {
  font-size: 9px; font-weight: 700; letter-spacing: 2.5px;
  text-transform: uppercase; color: var(--red); margin-bottom: 6px;
}
.podcast-hed {
  font-family: 'Playfair Display', serif; font-size: 13px; font-weight: 700;
  color: #c8d0e0; margin-bottom: 10px; line-height: 1.4;
}
.podcast-audio { width: 100%; height: 32px; accent-color: var(--red); display: block; }

/* ── Empty / loading ── */
#loading { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 14px; }
#empty { display: none; text-align: center; padding: 60px 20px; }
.empty-title { font-size: 18px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
.empty-text { font-size: 13px; color: var(--text-dim); line-height: 1.6; }

/* ── Bottom bar ── */
#bottombar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--navy);
  border-top: 1px solid #2e2e52;
  padding: 10px 16px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  display: flex;
  gap: 10px;
  justify-content: center;
}
.bottom-btn {
  flex: 1;
  max-width: 200px;
  padding: 12px;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .15s;
}
.bottom-btn:active { transform: scale(.97); }
.btn-vocab { background: transparent; color: #8a9bb5; border: 1px solid #2e2e52; text-decoration: none; display:flex; align-items:center; justify-content:center; }
.btn-vocab:hover { color: var(--cream); }
.btn-older { background: transparent; color: #8a9bb5; border: 1px solid #2e2e52; }
.btn-older:disabled { opacity: .3; cursor: default; }
.btn-newer { background: var(--red); color: #fff; border: none; }
.btn-newer:disabled { opacity: .3; cursor: default; background: #2e2e52; }

/* ── Toast ── */
#xp-toast {
  position: fixed;
  bottom: 80px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--navy); color: var(--cream);
  border: 1px solid #2e2e52;
  font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  padding: 8px 20px; border-radius: 4px;
  opacity: 0; transition: opacity .3s, transform .3s;
  pointer-events: none; z-index: 200;
}
#xp-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <div class="topbar-left">
    <a href="index.html" class="back-btn">← Vocab</a>
    <div>
      <div style="display:flex;align-items:baseline">
        <div class="topbar-title">中国简报</div>
        <div class="topbar-en">· China Brief</div>
      </div>
      <div class="topbar-pinyin">Zhōngguó Jiǎnbào</div>
    </div>
  </div>
  <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
    <div class="topbar-issue" id="topbar-subtitle"></div>
    <div style="display:flex;gap:6px;">
      <a href="japan-brief.html" class="back-btn" style="font-size:10px;padding:4px 8px;letter-spacing:0.5px;">Japan Brief →</a>
      <a href="china-ai-landscape-viz.html" class="back-btn" style="font-size:10px;padding:4px 8px;letter-spacing:0.5px;">China AI Map →</a>
    </div>
  </div>
</div>

<!-- Issue nav bar -->
<div id="issue-nav">
  <button class="nav-btn latest" id="nav-latest" onclick="goLatest()">Latest</button>
  <button class="nav-btn" id="nav-newer" onclick="navigateNewer()">← Newer</button>
  <button class="nav-btn" id="nav-older" onclick="navigateOlder()">Older →</button>
  <div class="nav-spacer"></div>
  <button class="nav-archive-btn" onclick="openArchive()">All Issues ▾</button>
</div>

<!-- Archive modal -->
<div id="archive-modal" onclick="if(event.target===this)closeArchive()">
  <div class="archive-sheet">
    <div class="archive-header">
      <span class="archive-title">All Issues</span>
      <button class="archive-close" onclick="closeArchive()">✕</button>
    </div>
    <div class="archive-body" id="archive-body"></div>
  </div>
</div>

<!-- Main content -->
<div id="content">
  <div id="loading">Loading brief…</div>
  <div id="empty">
    <div class="empty-title">No brief yet</div>
    <div class="empty-text">Add a brief to <code>briefs.json</code> in the repo to see it here.</div>
  </div>
  <div id="brief-content" style="display:none"></div>
</div>

<!-- Bottom nav -->
<div id="bottombar">
  <a href="index.html" class="bottom-btn btn-vocab">Study Vocab</a>
  <button class="bottom-btn btn-older" id="btn-older" onclick="navigateOlder()">Older →</button>
  <button class="bottom-btn btn-newer" id="btn-newer" onclick="navigateNewer()">← Newer</button>
</div>

<div id="xp-toast">Brief read</div>

<script>
let BRIEFS = [];
let currentIssue = null;

async function loadBriefs() {
  try {
    const r = await fetch('briefs.json');
    BRIEFS = await r.json();
    BRIEFS.sort((a, b) => b.issue - a.issue); // descending: newest first
  } catch(e) {
    console.error('Could not load briefs.json:', e);
    BRIEFS = [];
  }
  initBriefApp();
}

function initBriefApp() {
  document.getElementById('loading').style.display = 'none';
  if (!BRIEFS.length) {
    document.getElementById('empty').style.display = 'block';
    return;
  }
  const params = new URLSearchParams(window.location.search);
  const requested = parseInt(params.get('issue'));
  const target = BRIEFS.find(b => b.issue === requested) || BRIEFS[0];
  showIssue(target.issue);
}

// ── Navigation ──────────────────────────────────────────
function goLatest() { showIssue(BRIEFS[0].issue); }

function navigateNewer() {
  const idx = BRIEFS.findIndex(b => b.issue === currentIssue);
  if (idx > 0) showIssue(BRIEFS[idx - 1].issue);
}

function navigateOlder() {
  const idx = BRIEFS.findIndex(b => b.issue === currentIssue);
  if (idx < BRIEFS.length - 1) showIssue(BRIEFS[idx + 1].issue);
}

function updateNavState() {
  const idx = BRIEFS.findIndex(b => b.issue === currentIssue);
  const isLatest = idx === 0;
  const isOldest = idx === BRIEFS.length - 1;
  document.getElementById('nav-latest').classList.toggle('at-latest', isLatest);
  document.getElementById('nav-newer').disabled = isLatest;
  document.getElementById('nav-older').disabled = isOldest;
  document.getElementById('btn-newer').disabled = isLatest;
  document.getElementById('btn-older').disabled = isOldest;
}

// ── Archive modal ────────────────────────────────────────
function openArchive() {
  const body = document.getElementById('archive-body');
  const months = {};
  BRIEFS.forEach(b => {
    const d = new Date(b.date + 'T12:00:00');
    const key = d.toLocaleDateString('en-US', {month:'long', year:'numeric'});
    if (!months[key]) months[key] = [];
    months[key].push(b);
  });
  let html = '';
  for (const [month, issues] of Object.entries(months)) {
    html += `<div class="archive-month">${month}</div>`;
    issues.forEach(b => {
      const isLatest = b.issue === BRIEFS[0].issue;
      const isCurrent = b.issue === currentIssue;
      const dateStr = formatDate(b.date, false);
      const hed = b.title ? (b.title.length > 45 ? b.title.substring(0,45)+'…' : b.title) : '';
      html += `<div class="archive-row${isCurrent?' current':''}" onclick="pickArchive(${b.issue})">
        <span class="archive-num">#${b.issue}</span>
        <span class="archive-date">${dateStr}</span>
        <span class="archive-hed">${hed}</span>
        ${isLatest ? '<span class="archive-tag">Latest</span>' : ''}
      </div>`;
    });
  }
  body.innerHTML = html;
  // scroll current issue into view
  setTimeout(() => {
    const cur = body.querySelector('.current');
    if (cur) cur.scrollIntoView({block:'center'});
  }, 50);
  document.getElementById('archive-modal').classList.add('open');
}

function closeArchive() {
  document.getElementById('archive-modal').classList.remove('open');
}

function pickArchive(issueNum) {
  closeArchive();
  showIssue(issueNum);
}

// ── Show issue ───────────────────────────────────────────
function showIssue(issueNum) {
  const brief = BRIEFS.find(b => b.issue === issueNum);
  if (!brief) return;
  currentIssue = issueNum;
  history.replaceState({}, '', '?issue=' + issueNum);
  document.getElementById('topbar-subtitle').textContent =
    formatDate(brief.date, true) + ' · Issue #' + issueNum;
  updateNavState();
  renderBrief(brief);
  window.scrollTo({top: 0, behavior: 'smooth'});
  markRead(issueNum);
}

// ── Rendering ────────────────────────────────────────────
function renderBrief(brief) {
  const container = document.getElementById('brief-content');
  container.style.display = 'block';
  const tagMap = {
    ai:       ['tag-ai',     'AI & Tech'],
    macro:    ['tag-macro',  'Macro'],
    geo:      ['tag-geo',    'Geopolitics'],
    market:   ['tag-market', 'Markets'],
    policy:   ['tag-policy', 'Policy'],
    robotics: ['tag-ai',     'Robotics'],
    energy:   ['tag-geo',    'Energy'],
    trade:    ['tag-macro',  'Trade'],
    chip:     ['tag-ai',     'Chips & Semis'],
  };
  const roman = ['I','II','III','IV','V','VI','VII','VIII','IX','X'];
  const sectionsHtml = (brief.sections || []).map((sec, i) => {
    const [tagCls, tagLabel] = tagMap[sec.tag] || ['tag-policy', sec.tag || 'Note'];
    const vocabHtml = sec.vocab && sec.vocab.length
      ? `<div class="vocab-chips">
           <div class="vocab-chips-label">Vocab from this story</div>
           ${sec.vocab.map(v => `<div class="vocab-chip"><span class="chip-zh">${v.zh}</span><span class="chip-en">${v.en}</span></div>`).join('')}
         </div>` : '';
    const sourceHtml = sec.source ? `<div class="section-source">SOURCE · ${sec.source}</div>` : '';
    const takeawayHtml = sec.takeaway ? `<div class="takeaway-box"><strong>Key takeaway:</strong> ${sec.takeaway}</div>` : '';
    const bodyHtml = (sec.body||'').split('\n\n').map(p=>p.trim()).filter(Boolean).map(p=>`<p>${p}</p>`).join('');
    return `<div class="section-card" id="sec-${i}">
      <div class="section-header" onclick="toggleSection(${i})">
        <div class="section-num">${roman[i]||(i+1)}</div>
        <div class="section-title">${sec.title}</div>
        <span class="section-tag ${tagCls}">${tagLabel}</span>
        <span class="section-chevron">▼</span>
      </div>
      <div class="section-body">
        <div class="section-text">${bodyHtml}</div>
        ${sourceHtml}${takeawayHtml}${vocabHtml}
      </div>
    </div>`;
  }).join('');

  container.innerHTML = `
    <div class="brief-header">
      <div class="brief-issue-badge">ISSUE #${brief.issue}</div>
      <div class="brief-title">${brief.title}</div>
      <div class="brief-meta">${formatDate(brief.date, true)}</div>
      ${brief.summary ? `<div class="brief-summary">${brief.summary}</div>` : ''}
    </div>
    <div class="podcast-wrap" id="podcast-wrap">
      <div class="podcast-eyebrow">Daily Podcast · 2-min Audio Overview</div>
      <div class="podcast-hed">${brief.title}</div>
      <audio class="podcast-audio" controls preload="metadata"
        onloadedmetadata="document.getElementById('podcast-wrap').style.display='block'"
        onerror="document.getElementById('podcast-wrap').style.display='none'">
        <source src="podcast_${brief.date}.m4a" type="audio/mp4">
      </audio>
    </div>
    ${sectionsHtml}
    ${brief.viz_url ? `
    <a href="${brief.viz_url}" style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 8px;padding:18px 20px;background:#1a1a2e;border-left:4px solid #c0392b;border-radius:6px;text-decoration:none;box-shadow:0 2px 12px rgba(0,0,0,0.12);">
      <div>
        <div style="font-size:9px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#c0392b;margin-bottom:6px;">AI Visualized · Data in Focus</div>
        <div style="font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:#fff;line-height:1.3;">Charts &amp; data for this issue</div>
        <div style="font-size:11px;color:#4a5a7a;margin-top:4px;font-weight:500;">Interactive visualizations →</div>
      </div>
      <div style="font-size:22px;color:#c0392b;flex-shrink:0;">→</div>
    </a>` : ''}
    <div style="text-align:center;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#9a8a7a;margin-top:32px;padding:0 20px">
      中国简报 · <a href="index.html" style="color:#c0392b;text-decoration:none">Study the vocab →</a>
    </div>`;

  setTimeout(() => {
    const firstSec = document.getElementById('sec-0');
    if (firstSec) firstSec.classList.add('open');
  }, 100);
}

function toggleSection(i) {
  document.getElementById('sec-' + i).classList.toggle('open');
}

// ── Utilities ────────────────────────────────────────────
function formatDate(dateStr, long) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr + 'T12:00:00');
    if (long) return d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});
    return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  } catch { return dateStr; }
}

function markRead(issueNum) {
  try {
    const read = JSON.parse(localStorage.getItem('cn_briefs_read') || '[]');
    if (!read.includes(issueNum)) {
      read.push(issueNum);
      localStorage.setItem('cn_briefs_read', JSON.stringify(read));
      showToast();
    }
  } catch {}
}

function showToast() {
  const t = document.getElementById('xp-toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

loadBriefs();
</script>
</body>
</html>
