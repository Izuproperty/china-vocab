  <input type="password" id="pw" placeholder="password" onkeydown="if(event.key==='Enter')unlock()">
  <button onclick="unlock()">Enter →</button>
  <div class="err" id="err"></div>
</div>
<script>
var H='85f1cfe842570b704a8acf922e18161ca190a9646bcce355389bdd4242331725',K='pg_auth';
async function sha256(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');}
async function unlock(){var h=await sha256(document.getElementById('pw').value);if(h===H){localStorage.setItem(K,H);location.reload();}else{document.getElementById('err').textContent='Incorrect password';}}
</script>
</body>
